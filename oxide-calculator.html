<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oxide Raid Calculator — Fan Project</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #080b0f;
    --panel: #10151b;
    --panel-2: #151b22;
    --border: rgba(255,255,255,0.08);
    --text: #f4f7fa;
    --muted: #8c98a5;
    --accent: #ff6b22;
    --accent-2: #ff914d;
    --green: #43d17b;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,94,20,0.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(255,94,20,0.08),
            transparent 30%
        ),
        var(--bg);
}

/* =========================
HEADER
========================= */

header {
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    border-bottom: 1px solid var(--border);

    background: rgba(8,11,15,0.9);

    backdrop-filter: blur(15px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-weight: 900;
    letter-spacing: 1px;
}

.logo-icon {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            #c93600
        );

    font-size: 20px;

    box-shadow:
        0 8px 25px rgba(255,107,34,0.2);
}

.logo span {
    color: var(--accent);
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--muted);
    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 12px var(--green);
}

/* =========================
HERO
========================= */

.hero {
    text-align: center;

    padding: 70px 20px 35px;
}

.badge {
    display: inline-block;

    padding: 7px 13px;
    margin-bottom: 20px;

    border: 1px solid rgba(255,107,34,0.25);
    border-radius: 999px;

    color: var(--accent-2);

    background: rgba(255,107,34,0.07);

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

h1 {
    font-size: clamp(38px, 6vw, 68px);

    line-height: 1;

    letter-spacing: -3px;

    margin-bottom: 18px;
}

h1 span {
    color: var(--accent);
}

.hero p {
    max-width: 620px;

    margin: auto;

    color: var(--muted);

    line-height: 1.7;

    font-size: 16px;
}

/* =========================
MAIN
========================= */

.container {
    width: min(1100px, 92%);

    margin: 30px auto 80px;
}

.calculator {
    display: grid;

    grid-template-columns:
        1.15fr
        0.85fr;

    gap: 20px;
}

/* =========================
PANELS
========================= */

.panel {
    padding: 28px;

    border: 1px solid var(--border);

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.045),
            rgba(255,255,255,0.015)
        );

    box-shadow:
        0 25px 80px rgba(0,0,0,0.25),
        inset 0 1px rgba(255,255,255,0.03);
}

.panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.panel-title h2 {
    font-size: 20px;
}

.panel-title small {
    color: var(--muted);
}

/* =========================
FIELDS
========================= */

.field {
    margin-bottom: 24px;
}

label {
    display: block;

    margin-bottom: 9px;

    color: var(--muted);

    font-size: 13px;
    font-weight: 600;
}

select,
input {
    width: 100%;

    padding: 15px 16px;

    border: 1px solid var(--border);
    border-radius: 13px;

    outline: none;

    color: var(--text);
    background: var(--panel-2);

    font-size: 15px;

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

select:focus,
input:focus {
    border-color: rgba(255,107,34,0.65);

    box-shadow:
        0 0 0 4px rgba(255,107,34,0.08);
}

/* =========================
RAID OPTIONS
========================= */

.raid-options {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.raid-option {
    position: relative;
}

.raid-option input {
    position: absolute;

    opacity: 0;

    pointer-events: none;
}

.raid-card {
    display: flex;
    align-items: center;

    gap: 13px;

    padding: 15px;

    margin: 0;

    border: 1px solid var(--border);

    border-radius: 14px;

    color: var(--text);

    background: var(--panel-2);

    cursor: pointer;

    transition: 0.2s;
}

.raid-card:hover {
    transform: translateY(-2px);

    border-color:
        rgba(255,107,34,0.35);
}

.raid-option input:checked + .raid-card {
    border-color: var(--accent);

    background:
        rgba(255,107,34,0.09);

    box-shadow:
        0 0 25px rgba(255,107,34,0.08);
}

.item-icon {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: #202731;

    font-size: 20px;
}

.raid-card strong {
    display: block;

    margin-bottom: 4px;

    color: var(--text);
}

.raid-card small {
    color: var(--muted);
}

/* =========================
BUTTON
========================= */

.calculate-btn {
    width: 100%;

    padding: 17px;

    margin-top: 5px;

    border: 0;

    border-radius: 14px;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            #e44808
        );

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 12px 35px
        rgba(255,107,34,0.2);

    transition: 0.2s;
}

.calculate-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 16px 45px
        rgba(255,107,34,0.3);
}

.calculate-btn:active {
    transform: translateY(0);
}

/* =========================
RESULT
========================= */

.result-panel {
    min-height: 100%;

    display: flex;
    flex-direction: column;
}

.result-box {
    flex: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 35px 20px;

    text-align: center;

    border: 1px solid var(--border);

    border-radius: 18px;

    background:
        radial-gradient(
            circle at center,
            rgba(255,107,34,0.13),
            transparent 65%
        ),
        #0d1217;
}

.result-label {
    margin-bottom: 12px;

    color: var(--muted);

    font-size: 13px;
}

.result-number {
    font-size: clamp(65px, 8vw, 105px);

    line-height: 0.9;

    font-weight: 900;

    color: var(--accent);

    letter-spacing: -5px;

    text-shadow:
        0 0 40px
        rgba(255,107,34,0.2);

    transition:
        transform 0.2s,
        opacity 0.2s;
}

.result-item {
    margin-top: 18px;

    font-size: 18px;
    font-weight: 700;
}

.result-details {
    margin-top: 8px;

    color: var(--muted);

    font-size: 13px;
}

.divider {
    width: 100%;
    height: 1px;

    margin: 25px 0;

    background: var(--border);
}

.stats {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.stat {
    padding: 13px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background:
        rgba(255,255,255,0.025);
}

.stat span {
    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 11px;
}

.stat strong {
    font-size: 14px;
}

/* =========================
REFERENCE TABLE
========================= */

.reference {
    margin-top: 20px;
}

.reference h2 {
    margin-bottom: 18px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;

    border-collapse: collapse;
}

th,
td {
    padding: 14px 12px;

    text-align: left;

    border-bottom: 1px solid var(--border);

    font-size: 13px;
}

th {
    color: var(--muted);

    font-weight: 600;
}

td {
    color: #dce2e7;
}

tr:last-child td {
    border-bottom: none;
}

.hp {
    color: var(--accent-2);

    font-weight: 700;
}

/* =========================
DISCLAIMER
========================= */

.disclaimer {
    width: min(900px, 92%);

    margin: 0 auto 30px;

    padding: 18px 20px;

    border: 1px solid rgba(255,107,34,0.18);

    border-radius: 15px;

    color: #aab3bc;

    background:
        rgba(255,107,34,0.045);

    text-align: center;

    font-size: 12px;

    line-height: 1.7;
}

.disclaimer strong {
    color: var(--accent-2);
}

/* =========================
FOOTER
========================= */

footer {
    padding: 30px;

    text-align: center;

    color: #5f6973;

    font-size: 12px;

    border-top: 1px solid var(--border);
}

/* =========================
RESPONSIVE
========================= */

@media (max-width: 800px) {

    header {
        padding: 0 5%;
    }

    .status {
        display: none;
    }

    .hero {
        padding-top: 50px;
    }

    .calculator {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 20px;
    }
}

@media (max-width: 480px) {

    .raid-options {
        grid-template-columns: 1fr;
    }

    h1 {
        letter-spacing: -2px;
    }

    .hero p {
        font-size: 14px;
    }
}

</style>
</head>
